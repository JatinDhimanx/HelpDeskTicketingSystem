name: Build and Release JAR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          mvn clean package -DskipTests -B || true

      - name: Find and Stage Artifact
        run: |
          mkdir -p dist
          if [ -f target/HelpDeskTicketingSystem-1.0-SNAPSHOT-jar-with-dependencies.jar ]; then
            cp target/HelpDeskTicketingSystem-1.0-SNAPSHOT-jar-with-dependencies.jar dist/HelpDeskTicketingSystem.jar
          elif [ -f target/dist/HelpDeskTicketingSystem.jar ]; then
            cp target/dist/HelpDeskTicketingSystem.jar dist/HelpDeskTicketingSystem.jar
          elif [ -f target/HelpDeskTicketingSystem-1.0-SNAPSHOT.jar ]; then
            cp target/HelpDeskTicketingSystem-1.0-SNAPSHOT.jar dist/HelpDeskTicketingSystem.jar
          fi
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HelpDeskTicketingSystem.jar
          tag_name: ${{ github.ref_name }}
          name: "Help Desk Ticketing System ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
