name: Build and Release JAR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          mvn clean package -DskipTests -B || {
            echo "Maven build encountered an error, running fallback javac/jar build..."
            mvn dependency:copy-dependencies -DoutputDirectory=target/dependency -B || true
            mkdir -p target/classes dist
            CP=$(find target/dependency ~/.m2 -name "*.jar" 2>/dev/null | tr '\n' ':')
            javac -cp "$CP" -d target/classes $(find src/main/java -name "*.java")
            cp -r src/main/resources/* target/classes/ 2>/dev/null || true
            cd target/classes
            jar cfe ../../dist/HelpDeskTicketingSystem.jar helpdesk.core.Main .
            cd ../..
          }

      - name: Find and Stage Artifact
        run: |
          mkdir -p dist
          if [ -f dist/HelpDeskTicketingSystem.jar ]; then
            echo "Artifact dist/HelpDeskTicketingSystem.jar is already staged."
          elif [ -f target/HelpDeskTicketingSystem-1.0-SNAPSHOT-jar-with-dependencies.jar ]; then
            cp target/HelpDeskTicketingSystem-1.0-SNAPSHOT-jar-with-dependencies.jar dist/HelpDeskTicketingSystem.jar
          elif [ -f target/HelpDeskTicketingSystem-1.0-SNAPSHOT.jar ]; then
            cp target/HelpDeskTicketingSystem-1.0-SNAPSHOT.jar dist/HelpDeskTicketingSystem.jar
          elif [ -f target/dist/HelpDeskTicketingSystem.jar ]; then
            cp target/dist/HelpDeskTicketingSystem.jar dist/HelpDeskTicketingSystem.jar
          else
            cp target/*.jar dist/HelpDeskTicketingSystem.jar
          fi
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HelpDeskTicketingSystem.jar
          tag_name: ${{ github.ref_name }}
          name: "Help Desk Ticketing System ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
